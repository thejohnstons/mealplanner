<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D0E3FF">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Johnston’s Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F7F5F1; --surface:#FFFFFF; --ink:#22201D; --sub:#7A746B; --line:#E6E1D8;
    --accent:#5F6F52; --accent-ink:#FFFFFF; --accent-soft:#E8ECE3; --danger:#9A3B2E;
    --notice-bg:#F1ECE1; --notice-ink:#5C4A2A;
    --serif:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --sans:"Karla", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  .wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 96px}
  .serif{font-family:var(--serif)}
  .sub{color:var(--sub)}
  .num{font-variant-numeric:tabular-nums}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:500}
  .hidden{display:none}

  /* Masthead */
  .mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .mast h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,50px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
  .mast p{margin:8px 0 0}
  .mast-tools{display:flex;gap:14px;align-items:center;font-size:13px}
  .status{display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sub)}
  .dot.live{background:var(--accent)}
  .linkish{color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:1px}
  .linkish:hover{color:var(--ink);border-color:var(--ink)}

  /* Tabs */
  .tabs{display:flex;gap:28px;margin:18px 0 28px;overflow-x:auto}
  .tab{padding:6px 0;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-color:var(--accent)}

  /* Buttons + fields */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
  .btn:hover{border-color:var(--sub)}
  a.btn{text-decoration:none}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.small{padding:6px 12px;font-size:13px}
  .icon-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:inline-grid;place-items:center;font-size:14px;line-height:1;color:var(--sub);background:var(--surface)}
  .icon-btn:hover{color:var(--ink);border-color:var(--sub)}
  .field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
  .field:focus{border-color:var(--accent);outline:none}
  select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
  .notice{background:var(--notice-bg);color:var(--notice-ink);padding:12px 14px;border-radius:6px;font-size:14px;margin-bottom:20px}
  input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}

  /* Planner */
  .weekbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .weekbar .range{font-family:var(--serif);font-size:26px;font-weight:500;min-width:190px;text-align:center}
  .weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .weektotal{text-align:right}
  .weektotal .amt{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--accent)}
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 26px}
  .day{border-top:1px solid var(--ink);padding-top:10px}
  .day.today{border-top:2px solid var(--accent)}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .day-name{font-family:var(--serif);font-size:25px;font-weight:500}
  .day.today .day-name{color:var(--accent)}
  .meal{padding:9px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal-title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;text-align:left;margin-top:2px}
  .meal-title:hover{color:var(--accent)}
  .meal-item + .meal-item{margin-top:10px}
  .meal-item + select.field, .meal-item + .field{margin-top:10px}
  .meal-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
  .remove{margin-left:auto;font-size:12px;color:var(--sub)}
  .remove:hover{color:var(--danger)}
  .meal select.field{padding:6px 28px 6px 9px;font-size:13px;margin-top:4px;color:var(--sub)}

  /* Recipes */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:26px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .filter{font-size:14px;color:var(--sub);padding-bottom:2px;border-bottom:1px solid transparent}
  .filter.active{color:var(--ink);border-color:var(--ink)}
  .filters select{margin-left:auto;width:auto;font-size:13px;padding:6px 28px 6px 10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px}
  .rcard{text-align:left;display:flex;flex-direction:column;gap:10px}
  .photo{width:100%;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;max-width:100%}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .rcard:hover .photo img{transform:scale(1.025)}
  .photo .initial{font-family:var(--serif);font-size:64px;color:var(--accent);opacity:.55;font-style:italic}
  .rcard h3{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;margin:0}
  .rcard:hover h3{color:var(--accent)}
  .tags{display:flex;gap:10px;flex-wrap:wrap}
  .meta{font-size:13px;color:var(--sub)}
  .price{font-size:13px;color:var(--accent);font-weight:500}
  .source{font-family:var(--serif);font-style:italic;font-size:19px;margin-bottom:4px}
  .srclink{font-family:var(--sans);font-style:normal;font-size:14px;color:var(--accent);border-bottom:1px solid currentColor}

  /* Recipe detail */
  .back{font-size:14px;color:var(--sub);margin-bottom:18px;display:inline-block}
  .back:hover{color:var(--ink)}
  .hero{width:100%;max-height:480px;aspect-ratio:3/2;border-radius:4px;overflow:hidden;margin-bottom:26px;background:var(--accent-soft);max-width:100%}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .detail-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,46px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
  .actions{display:flex;gap:16px;align-items:center;font-size:14px;flex-wrap:wrap}
  .actions .danger{color:var(--danger)}
  .serves{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px}
  .serves .n{font-family:var(--serif);font-size:24px;font-weight:600;min-width:24px;text-align:center}
  .serves .cost{margin-left:auto;color:var(--accent);font-weight:500}
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px}
  @media (max-width:720px){.two-col{grid-template-columns:1fr;gap:28px}}
  .col-title{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 10px}
  .ing-list{list-style:none;margin:0;padding:0}
  .ing-list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
  .ing-list .q{min-width:74px;color:var(--sub)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:6px;padding:10px 0;max-width:62ch}
  .steps li::before{content:counter(s);font-family:var(--serif);font-size:24px;line-height:1;color:var(--accent);font-weight:600}

  /* Form */
  .form{display:grid;gap:18px;max-width:720px}
  .form .title-field{font-family:var(--serif);font-size:28px;font-weight:600;padding:8px 11px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .photo-field{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .photo-field .photo{width:180px;flex:none}
  .photo-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface)}
  .ing-row{display:flex;gap:6px;margin-bottom:6px}
  .ing-row .qty{width:64px;flex:none}.ing-row .unit{width:76px;flex:none}.ing-row .name{flex:1;min-width:0}
  .textlink{color:var(--accent);font-size:14px}

  /* Grocery */
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:26px clamp(18px,4vw,36px);max-width:760px}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:10px}
  .sheet-head h2{font-family:var(--serif);font-weight:500;font-size:32px;margin:0;line-height:1.1}
  .sheet-head .amt{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--accent)}
  .aisle{margin-top:22px}
  .aisle .label{margin-bottom:4px}
  .gitem{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .gitem.done .txt{text-decoration:line-through;color:var(--sub)}
  .gitem .q{color:var(--sub);min-width:70px}
  .gitem .p{margin-left:auto;color:var(--sub);font-size:13px}
  .empty{color:var(--sub);font-family:var(--serif);font-size:21px;font-style:italic}
  .range-bar{display:grid;gap:12px;margin-bottom:22px;max-width:760px}
  .range-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .range-row label{display:flex;flex-direction:column;gap:6px}
  .range-row input[type=date]{width:auto;padding:7px 10px;font-size:14px}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .preset.active{border-color:var(--accent);color:var(--accent)}
  .export-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .tip{background:var(--accent-soft);border-radius:6px;padding:14px 16px;margin-top:14px;font-size:14px}
  .tip ol{margin:6px 0 0;padding-left:20px}
  .tip textarea{width:100%;margin-top:10px;font-size:13px}
  .fine{font-size:12px;color:var(--sub);margin-top:18px}

  .spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  .dot.warn{background:#B7791F}
  .notice.ok{background:var(--accent-soft);color:var(--ink)}
  code{font-size:13px;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
  .gate{max-width:440px;margin:12vh auto 0;display:grid;gap:16px;justify-items:start}
  .gate h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,8vw,48px);line-height:1.05;margin:0 0 6px}
  .gate p{margin:0}
  .settings{display:grid;gap:28px;max-width:640px}
  .settings section{display:grid;gap:8px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .settings p{margin:0}
  .settings section > .btn{justify-self:start}

  /* ===== v2: Johnston palette, new planner features ===== */
  :root{
    --bg:#F7F1E8; --surface:#FFFDF9; --ink:#2B2522; --sub:#76695E; --line:#EADFD1;
    --accent:#B5312B; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF; --danger:#A12A1F;
    --notice-bg:#FFF1CC; --notice-ink:#5B4515;
    --butter-soft:#FFF3D6; --matcha-soft:#EEF0DE; --attic-soft:#E4EFFA; --apricot-soft:#FDEBD5;
    --wisteria-soft:#ECE9F9; --seafoam-soft:#E3F3F8; --slipper-soft:#FDE3E3;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
  }
  .mast h1{font-size:clamp(30px,5.5vw,46px)}
  .home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:12px}
  .home-link:hover{color:var(--accent)}
  .day-name{font-size:22px}
  .meal-title{font-size:17px;font-weight:500}
  .rcard h3{font-size:21px;font-weight:500}
  .detail-head h2{font-weight:450}
  .hero{aspect-ratio:4/3;max-height:520px}
  .weekbar .range{font-size:23px}
  .photo .initial{font-size:56px}

  /* Planner extras */
  .plan-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
  .slot-add{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;margin-top:6px}
  .slot-add:hover{color:var(--accent);border-color:var(--accent)}
  .etag{display:flex;width:fit-content;align-items:center;gap:5px;margin-bottom:2px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--butter-soft);color:var(--ink)}
  .t-leftovers{background:var(--seafoam-soft)} .t-freezer{background:var(--attic-soft)} .t-out{background:var(--apricot-soft)}
  .t-pantry{background:var(--matcha-soft)} .t-tbd{background:var(--wisteria-soft)} .t-custom{background:var(--slipper-soft)}
  .entry-text{font-family:var(--serif);font-size:17px;line-height:1.25;margin-top:4px}
  .entry-sub{font-size:12px;color:var(--sub)}
  .note-field{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:8px 0 0;margin-top:4px;font-size:13px;color:var(--sub);resize:none;min-height:30px;font-style:italic;line-height:1.45}
  .note-field:focus{outline:none;color:var(--ink);font-style:normal;border-top-color:var(--accent)}

  /* Picker sheet */
  .backdrop{position:fixed;inset:0;background:rgba(30,20,15,.4);z-index:40}
  .picker{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:min(84vh,720px);background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (min-width:700px){.picker{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:20px}}
  .picker-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 4px}
  .picker-head h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;line-height:1.15}
  .ptabs{display:flex;gap:6px;padding:10px 20px 12px;overflow-x:auto}
  .ptab{padding:6px 14px;border-radius:999px;font-size:14px;background:var(--bg);color:var(--sub);white-space:nowrap}
  .ptab.active{background:var(--ink);color:var(--surface)}
  .pbody{overflow-y:auto;padding:0 20px 22px;-webkit-overflow-scrolling:touch}
  .pgroup{font-size:12px;color:var(--sub);margin:16px 0 2px;font-weight:700}
  .prow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
  .prow:hover .pt{color:var(--accent)}
  .prow .pt{font-family:var(--serif);font-size:18px;line-height:1.2}
  .prow .pm{font-size:12px;color:var(--sub);white-space:nowrap}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .quick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;text-align:left;font-weight:500;line-height:1.3}
  .quick button:hover{outline:2px solid var(--line)}
  .quick .qi{font-size:22px}
  .quick .qd{font-size:12px;font-weight:400;color:var(--sub)}

  /* Recipes */
  .search{flex:1 1 220px;max-width:360px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .seg button{padding:5px 12px;font-size:13px;color:var(--sub)}
  .seg button.on{background:var(--ink);color:var(--surface)}
  .conv-note{font-size:13px;background:var(--attic-soft);border-radius:8px;padding:10px 12px;margin:-12px 0 22px;max-width:760px}
  .fz-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
  .fz-inline input{width:70px}

  /* Freezer */
  .fz-list{max-width:760px}
  .fz-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
  .fz-name{font-family:var(--serif);font-size:21px;line-height:1.2;text-align:left}
  button.fz-name:hover{color:var(--accent)}
  .fz-count{display:flex;align-items:center;gap:8px;grid-row:span 2}
  .fz-count .n{font-family:var(--serif);font-size:26px;min-width:30px;text-align:center}
  .fz-item.gone .fz-name{color:var(--sub)}
  .fz-form{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) 90px minmax(0,1fr);align-items:end;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px}
  @media (max-width:620px){.fz-form{grid-template-columns:1fr 1fr}.fz-form .wide{grid-column:1/-1}}
  .fz-form label{display:flex;flex-direction:column;gap:6px}

  /* Shopping list extras */
  .gitem .txt{display:flex;flex-direction:column}
  .notice.ok{background:var(--matcha-soft)}
  /* iPhones zoom into any text box smaller than 16px; keep them at 16px on touch screens */
  @media (pointer:coarse){ .field, .note-field, textarea, select{font-size:16px} }
  .gitem .src{font-size:12px;color:var(--sub);text-decoration:none}
  .gitem.done .src{text-decoration:none}

  /* Photo cropper */
  .crop-wrap{position:fixed;inset:0;z-index:60;background:rgba(20,15,12,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;color:#fff}
  .crop-wrap canvas{touch-action:none;border-radius:6px;max-width:100%;cursor:grab;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
  .crop-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .crop-tools input[type=range]{width:200px;accent-color:#fff}
  .crop-wrap .btn{background:#fff;color:#2B2522;border-color:#fff}
  .crop-wrap .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}

  /* ===== v3: café style (blue and cream awning, espresso and rust) ===== */
  :root{
    --bg:#FFF9F0; --surface:#FFFFFF; --ink:#4C2B08; --sub:#7A5A3E; --line:#E6D9C6;
    --accent:#8A3B1C; --accent-ink:#FFF9F0; --accent-soft:#F4DCCB; --danger:#9B2F1E;
    --notice-bg:#D0E3FF; --notice-ink:#4C2B08;

<body>
<div id="app" class="wrap"></div>
<script src="firebase-config.js"></script>

<script>
/* ---------- CONSTANTS ---------- */
const LS_S='smp_settings';
const MEALS=['Breakfast','Lunch','Dinner','Dessert','Snacks'];
const OPTIONAL_MEALS=['Dessert','Snacks']; // hidden unless ticked on, or already planned that day
const CATEGORIES=[...MEALS,'Salads','Baking','Sauces & spices'];
// Planner entries that aren't a recipe. Older entries have no type and are recipes.
const ENTRY_TYPES = {
  leftovers:{icon:'🍲', label:'Leftovers'},
  freezer:{icon:'🧊', label:'From the freezer'},
  out:{icon:'🍽️', label:'Eating out', hint:'Café, takeaway, family dinner'},
  pantry:{icon:'🥫', label:'Use what we have', hint:'Cook from the fridge and pantry'},
  tbd:{icon:'❔', label:'To be decided', hint:'Hold the spot, decide later'},
  custom:{icon:'📝', label:'Something simple', hint:'Toast, sandwiches, cereal…'},
};
const DAY_NOTE='DayNote';
const DAY_NAMES=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ---------- HELPERS ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,120)||'x'; }
function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function getMonday(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); nd.setHours(0,0,0,0); return nd; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function fmtShort(d){ return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }
function fmtWeekRange(monday){
  const sunday=addDays(monday,6);
  const sameMonth=monday.getMonth()===sunday.getMonth();
  const startStr=monday.toLocaleDateString('en-AU',{day:'numeric',month:sameMonth?undefined:'short'});
  const endStr=sunday.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  return `${startStr} – ${endStr}`;
}
function weekDates(){ const monday=new Date(state.weekStart+'T00:00:00'); return [...Array(7)].map((_,i)=>isoDate(addDays(monday,i))); }
function planId(dateISO,meal){ return `${dateISO}__${meal}`; }
// Every planned entry for one meal on one day: [key, entry] pairs. Extra snacks
// use keys like "2026-09-28__Snacks__2".
function slotEntries(dateISO, meal, src){
  src = src || plan; const base = planId(dateISO, meal);
  return Object.keys(src).filter(k=>k===base || k.startsWith(base+'__'))
    .sort((a,b)=>(+(a.split('__')[2]||1))-(+(b.split('__')[2]||1)))
    .map(k=>[k, src[k]]);
}
function nextSlotKey(dateISO, meal){
  const base = planId(dateISO, meal);
  if(!plan[base]) return base;
  let n=2; while(plan[base+'__'+n]) n++; return base+'__'+n;
}

/* ---------- AISLE LOOKUP (groups the shopping list) ---------- */
// Checked in order, so specific matches ("coconut milk", "chicken stock") win over general ones.
const AISLE_RULES = [
  ['Fruit & veg', /\b(bell peppers?|spring onions?|green onions?|baby spinach|sweet potato(es)?|green beans?|snow peas|sugar snap)\b/],
  ['Pantry', /\b(stock|broth|bouillon|paste|sauce|vinegar|oil|honey|syrup|mustard|tinned|canned|passata|coconut (milk|cream)|peanut butter|tomato puree|jam|mayo(nnaise)?)\b/],
  ['Freezer', /\bfrozen\b/],
  ['Pantry', /\b(dried|ground|spices?|seasoning|paprika|cumin|cinnamon|nutmeg|turmeric|curry powder|chilli flakes|chili flakes|garam masala|salt|black pepper|white pepper|pepper|oregano|bay lea(f|ves))\b/],
  ['Dairy & eggs', /\b(milk|butter|cheese|cheddar|parmesan|mozzarella|feta|ricotta|haloumi|halloumi|cream|yoghurt|yogurt|eggs?)\b/],
  ['Meat & seafood', /\b(chicken|beef|mince|lamb|pork|bacon|ham|sausages?|steaks?|thighs?|drumsticks?|breasts?|salmon|fish|prawns?|tuna|turkey|chorizo|salami|prosciutto)\b/],
  ['Bakery', /\b(bread|wraps?|tortillas?|buns?|rolls?|pita|naan|bagels?|crumpets?|muffins, english)\b/],
  ['Fruit & veg', /\b(onions?|shallots?|garlic|ginger|tomato(es)?|potato(es)?|carrots?|capsicums?|broccoli(ni)?|cauliflower|zucchini|spinach|lettuce|cucumbers?|avocados?|lemons?|limes?|apples?|bananas?|berry|berries|mushrooms?|celery|corn|peas|beans|pumpkin|kale|cabbage|leeks?|herbs?|basil|coriander|parsley|mint|thyme|rosemary|dill|chives|rocket|beetroot|eggplant|asparagus|oranges?|mangoe?s?|pears?|grapes?|fruit|veg(etables?|gies)?|chillies|chilli|chili)\b/],
  ['Pantry', /\b(rice|pasta|spaghetti|penne|fusilli|macaroni|lasagne|noodles?|flour|sugar|baking|bicarb|yeast|oats|lentils?|chickpeas?|cereal|breadcrumbs|panko|cornflour|cornstarch|cocoa|chocolate|vanilla|nuts?|almonds?|walnuts?|cashews?|seeds?|quinoa|couscous|crackers?|sultanas|raisins|dates|coconut)\b/],
];
function guessAisle(name){ const n=String(name||'').toLowerCase(); const hit=AISLE_RULES.find(([,re])=>re.test(n)); return hit?hit[0]:'Other'; }
// Things most kitchens already have: listed without amounts, so you can check the cupboard.
const PANTRY_RE = /\b(salt|pepper|oil|spray|spices?|seasoning|paprika|cumin|cinnamon|nutmeg|turmeric|oregano|curry powder|garam masala|chilli flakes|chili flakes|stock paste|broth paste|stock powder|bouillon|soy sauce|fish sauce|oyster sauce|worcestershire|vinegar|baking powder|baking soda|bicarb|vanilla|dried)\b/;
const WATER_RE = /^(boiling |cold |warm |hot |iced |tap |filtered )?water$|^ice( cubes)?$/;
const PANTRY_AISLE = 'Pantry check';

function loadLS(k,def){ try{ return JSON.parse(localStorage.getItem(k))??def; }catch(e){ return def; } }
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------- STATE ---------- */
// auth.status: loading | noConfig | signedOut | signedIn | denied | demo
let auth = {status:'loading', email:'', error:''};
let sync = {online: navigator.onLine, pending:false};
let loaded = {recipes:false, plan:false};
let recipes = [], plan = {}, groceryChecks = {}, freezer = [];
const photoCache = {}, photoLoading = new Set();
let settings = {unit:'metric', showDessert:false, showSnacks:false, combine:true, metricView:false, ...loadLS(LS_S, {})};
function setSetting(k,v){ settings[k]=v; saveLS(LS_S, settings); render(); }
let state = { tab:'planner', editingRecipe:null, importText:'', weekStart:isoDate(getMonday(new Date())), recipeFilter:'All', recipeSort:'alpha', recipeSearch:'', error:'', pendingPhoto:null, info:'', picker:null };
state.shopFrom = state.weekStart;
state.shopTo = isoDate(addDays(new Date(state.weekStart+'T00:00:00'),6));
state.exportHeadings = false; state.exportMsg = null;

function isDemo(){ return auth.status==='demo'; }
function isEditingForm(){ return state.tab==='recipes' && (state.editingRecipe==='new-manual' || state.editingRecipe==='new-import'); }
// Data arriving from another device re-draws the page. While someone is typing in a
// note or search box, wait until they leave it so the text box isn't swapped out.
function liveRender(){
  if(isEditingForm()) return;
  const a=document.activeElement;
  if(a && a.hasAttribute && a.hasAttribute('data-live-edit')){ state.renderPending=true; return; }
  render();
}
function afterLiveEdit(){ if(state.renderPending){ state.renderPending=false; setTimeout(()=>{ const a=document.activeElement; if(!(a && a.hasAttribute && a.hasAttribute('data-live-edit'))) render(); else state.renderPending=true; }, 200); } }
function sampleRecipes(){
  return [
    {id:'r1', title:'Chicken Stir Fry', time:'25 min', servings:4, categories:['Dinner'], lastPlanned:null,
     ingredients:[{name:'Chicken breast',qty:500,unit:'g'},{name:'Brown onion',qty:1,unit:'each'},{name:'Capsicum',qty:2,unit:'each'},{name:'Rice',qty:300,unit:'g'},{name:'Olive oil',qty:2,unit:'tbsp'}],
     steps:['Slice chicken and vegetables.','Heat oil in a pan and cook chicken until browned.','Add vegetables and stir fry 5 min.','Serve over cooked rice.']},
    {id:'r2', title:'Spaghetti Bolognese', time:'35 min', servings:4, categories:['Dinner'], lastPlanned:null,
     ingredients:[{name:'Beef mince',qty:500,unit:'g'},{name:'Tinned tomatoes',qty:800,unit:'g'},{name:'Brown onion',qty:1,unit:'each'},{name:'Garlic',qty:2,unit:'clove'},{name:'Spaghetti',qty:400,unit:'g'}],
     steps:['Sauté onion and garlic.','Brown the mince.','Add tomatoes, simmer 20 min.','Cook pasta and combine.']},
    {id:'r3', title:'Scrambled Eggs & Toast', time:'10 min', servings:2, categories:['Breakfast'], lastPlanned:null,
     ingredients:[{name:'Egg',qty:4,unit:'each'},{name:'Butter',qty:20,unit:'g'},{name:'Milk',qty:30,unit:'mL'},{name:'Bread',qty:4,unit:'slice'}],
     steps:['Whisk eggs with milk.','Melt butter in pan, scramble eggs gently.','Toast bread and serve together.']},
  ];
}

/* ---------- DATA HOOKS (called by the Firebase module) ---------- */
function onAuth(a){
  auth = {...auth, ...a};
  if(auth.status!=='signedIn'){ recipes=[]; plan={}; groceryChecks={}; freezer=[]; loaded={recipes:false,plan:false}; }
  render();
}
function onRecipes(list){ recipes=list; loaded.recipes=true; liveRender(); }
function onPlan(map){ plan=map; loaded.plan=true; liveRender(); }
function onChecks(map){ groceryChecks=map; liveRender(); }
function onFreezer(list){ freezer=list; liveRender(); }
function onSync(s){ const before=JSON.stringify(sync); sync={...sync,...s}; if(JSON.stringify(sync)!==before) liveRender(); }
function startDemo(){ auth={status:'demo', email:'', error:''}; recipes=sampleRecipes(); plan={}; groceryChecks={};
  freezer=[{id:'f1', name:'Spaghetti Bolognese', recipeId:'r2', serves:6, frozenOn:isoDate(addDays(new Date(),-12)), note:''}];
  loaded={recipes:true,plan:true}; render(); }

/* ---------- DATA WRITES ---------- */
// Firestore applies writes to the local cache instantly (so the UI updates and
// works offline); the returned promise only settles once the server confirms,
// so writes are never awaited by the UI.
function showError(msg){ state.error=msg; render(); setTimeout(()=>{ if(state.error===msg){ state.error=''; liveRender(); } },8000); }
function write(remote, local){
  if(isDemo() || !window.DATA){ local(); render(); return; }
  try{
    Promise.resolve(remote()).catch(e=>{
      if(e && e.code==='permission-denied') showError("This Google account isn't allowed to change the planner.");
      else if(e && e.code==='resource-exhausted') showError("The free daily limit was reached. Changes will save again tomorrow.");
      else showError("Couldn't save that change ("+((e&&e.code)||'unknown error')+").");
    });
  }catch(e){ showError("Couldn't save that change."); }
}
function upsertLocal(r){ const i=recipes.findIndex(x=>x.id===r.id); if(i>=0) recipes[i]=r; else recipes.push(r); }
function putRecipe(r){ if(!isDemo() && window.DATA) upsertLocal(r); write(()=>DATA.setRecipe(r), ()=>upsertLocal(r)); }
function removeRecipe(id){ write(()=>DATA.deleteRecipe(id), ()=>{ recipes=recipes.filter(r=>r.id!==id); }); }
function putPlan(key,entry){ write(()=>DATA.setPlan(key,entry), ()=>{ plan[key]=entry; }); }
function removePlan(key){ write(()=>DATA.deletePlan(key), ()=>{ delete plan[key]; }); }
function putCheck(key,val){ const from=state.shopFrom, to=state.shopTo; write(()=>DATA.setCheck(from,to,key,val), ()=>{ if(val) groceryChecks[key]=true; else delete groceryChecks[key]; }); }
function putFreezer(item){ write(()=>DATA.setFreezer(item), ()=>{ const i=freezer.findIndex(x=>x.id===item.id); if(i>=0) freezer[i]=item; else freezer.push(item); }); }
function removeFreezer(id){ write(()=>DATA.deleteFreezer(id), ()=>{ freezer=freezer.filter(f=>f.id!==id); }); }
function adjustFreezer(id, delta){ const it=freezer.find(f=>f.id===id); if(!it || !delta) return; write(()=>DATA.adjustFreezer(id,delta), ()=>{ it.serves=(+it.serves||0)+delta; }); }
function dropAsset(id){ if(!id) return; delete photoCache[id]; write(()=>DATA.deletePhoto(id), ()=>{}); }

/* ---------- PHOTOS (stored as compressed images inside the database) ---------- */
function requestPhoto(id){
  if(!id || photoCache[id] || photoLoading.has(id) || !window.DATA || isDemo()) return;
  photoLoading.add(id);
  DATA.getPhoto(id).then(d=>{ if(d){ photoCache[id]=d; liveRender(); } }).catch(()=>{}).finally(()=>photoLoading.delete(id));
}
function photoSrc(id){ if(!id) return ''; if(id==='__pending__') return state.pendingPhoto||''; if(photoCache[id]) return photoCache[id]; requestPhoto(id); return ''; }

/* ---------- ADD FROM A WEBSITE (bookmark button) ---------- */
// The bookmark runs on the recipe page, reads the recipe, and opens this app with
// it in the address. Nothing is sent anywhere else.
// Order it tries: the recipe details most sites publish for Google (schema.org, even
// when tucked inside other page data), then any text you've selected, then older
// "microdata" recipes, then it reads the page itself from the "Ingredients" heading on
// (for blog-style sites like Squarespace that publish no recipe details at all).
const BOOKMARKLET_SRC = `(function(){var A='__APP__';var r=null;function f(o,d){if(!o||r||d>8||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(function(x){f(x,d+1)});return}var t=o['@type'];if(t==='Recipe'||(Array.isArray(t)&&t.indexOf('Recipe')>-1)){r=o;return}for(var k in o){if(o[k]&&typeof o[k]==='object')f(o[k],d+1)}}document.querySelectorAll('script[type="application/ld+json"]').forEach(function(s){try{f(JSON.parse(s.textContent),0)}catch(e){}});function tx(x){if(typeof x==='string')return[x];if(x&&x.itemListElement)return[].concat.apply([],[].concat(x.itemListElement).map(tx));if(x&&x.text)return[x.text];return[]}var d,sel=String(getSelection()||'').trim();if(r){var au=r.author;au=Array.isArray(au)?au[0]:au;d={t:r.name||document.title,a:typeof au==='string'?au:(au&&au.name)||'',y:r.recipeYield||'',p:r.prepTime||'',c:r.cookTime||'',tt:r.totalTime||'',i:[].concat(r.recipeIngredient||r.ingredients||[]),s:tx({itemListElement:[].concat(r.recipeInstructions||[])}),u:location.href}}else if(sel.length>40){d={x:sel,u:location.href}}else{var m=document.querySelector('[itemtype*="schema.org/Recipe"]');var ii=m?[].map.call(m.querySelectorAll('[itemprop=recipeIngredient],[itemprop=ingredients]'),function(e){return e.innerText}):[];if(ii.length){var h=m.querySelector('[itemprop=name]');d={t:(h&&h.innerText)||document.title,i:ii,s:[].map.call(m.querySelectorAll('[itemprop=recipeInstructions]'),function(e){return e.innerText}).join('\\n').split('\\n'),u:location.href}}else{var root=document.querySelector('article')||document.querySelector('main')||document.body;var txt=root.innerText||'';var at=txt.search(/(^|\\n)\\s*ingredients?\\s*:?\\s*(\\n|$)/i);if(at<0){alert('No recipe found on this page. Select the recipe text (title, ingredients and method), then tap the bookmark again.');return}var h1=document.querySelector('h1');d={x:((h1&&h1.innerText)||document.title)+'\\n'+txt.slice(Math.max(0,at-1500),at+9000),u:location.href}}}var url=A+'#import='+encodeURIComponent(JSON.stringify(d));var w=window.open(url,'_blank');if(!w)location.href=url})();`;
function appAddress(){ return location.origin + location.pathname; }
function bookmarkletCode(){ return 'javascript:' + BOOKMARKLET_SRC.replace('__APP__', appAddress().replace(/'/g,"\\'")); }
function decodeHtml(s){ const t=document.createElement('textarea'); t.innerHTML=String(s||'').replace(/<[^>]*>/g,' '); return t.value.replace(/\s+/g,' ').trim(); }
function readImportHash(){
  if(!location.hash.startsWith('#import=')) return;
  try{ state.webImport = JSON.parse(decodeURIComponent(location.hash.slice(8))); }catch(e){ state.webImport = null; showError("That recipe link couldn't be read. Try the bookmark again."); }
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash=''; }
}
function consumeWebImport(){
  const d = state.webImport; if(!d) return;
  state.webImport = null;
  let draft;
  if(d.x){
    const parsed = parseImport(String(d.x));
    draft = {title:parsed.title, author:parsed.author, sourceUrl:cleanUrl(d.u)||parsed.sourceUrl, time:parsed.time||'', servings:parsed.servings||4, ingredients:parsed.ingredients, steps:parsed.steps};

const US_WORDS = /°\s*F\b|\d\s*F\b|\b\d+\s*(oz|ounces?|lbs?|pounds?)\b|\ball[- ]purpose\b|\bcilantro\b|\bscallions?\b|\bheavy cream\b|\bsticks? of butter\b|\bkosher salt\b|\bconfectioners/i;
// Australian unless something says otherwise: the site's country, a known US site, or US wording.
function guessCupSize(url, rawText){
  const h = urlHost(url);
  if(h && (/\.(au|nz|uk|ie)$/.test(h) || AU_SITES.some(x=>h===x || h.endsWith('.'+x)))) return 'au';
  if(h && US_SITES.some(x=>h===x || h.endsWith('.'+x))) return 'us';
  if(rawText && US_WORDS.test(rawText)) return 'us';
  return 'au';
}
function cupSizeOf(r){ return r && r.cupSize ? r.cupSize : guessCupSize(r && r.sourceUrl); }
function niceRound(n){ return n<20 ? Math.max(1,Math.round(n)) : n<500 ? Math.round(n/5)*5 : Math.round(n/10)*10; }
function toMetric(ing, sys){
  if(ing.qty==null || ing.qty==='' || isNaN(ing.qty) || ing.unit!=='cup') return null;
  const text = (ing.name+' '+(ing.note||'')).toLowerCase();
  if(/\bcooked\b/.test(text)) return null;
  const isMilk = /\bmilk\b/.test(text) && !/\bmilk chocolate\b/.test(text);   // rice milk, oat milk
  const w = !isMilk && CUP_WEIGHTS.find(([re])=>re.test(text));
  if(w) return {qty:niceRound(ing.qty*(sys==='us'?w[2]:w[1])), unit:'g', approx:true};
  if(LIQUID_RE.test(text)) return {qty:niceRound(ing.qty*CUP_ML[sys]), unit:'mL', approx:false};
  return null;
}
function metricIng(ing, sys){ const m = toMetric(ing, sys); return m ? {...ing, ...m} : ing; }
function fToC(f){ return Math.round((+f-32)*5/9/10)*10; }
function inchToCm(v){ const c = evalFraction(v)*2.54; return c<3 ? +c.toFixed(1) : Math.round(c); }
const NUM = '(\\d+\\s\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?)';
function convertStepText(t){
  return String(t||'')
    .replace(/(\d{3})\s*°?\s*F\s*\(\s*(\d{2,3})\s*°?\s*C\s*\)/gi, '$2°C')              // 350°F (180°C) → 180°C
    .replace(/(\d{2,3})\s*°\s*C\s*[\(\/]\s*\d{3}\s*°?\s*F\s*\)?/gi, '$1°C')            // 180°C (350°F) → 180°C
    .replace(/(\d{3})\s*(?:°|º|degrees?)\s*(?:F\b|Fahrenheit)/gi, (m,f)=>fToC(f)+'°C')
    .replace(/\b(\d{3})F\b/g, (m,f)=>fToC(f)+'°C')
    .replace(new RegExp(NUM+'\\s*(?:x|×|by)\\s*'+NUM+'[\\s-]*(?:inch(?:es)?\\b|in\\.|["”])', 'gi'), (m,a,b)=>`${inchToCm(a)} x ${inchToCm(b)} cm`)
    .replace(new RegExp(NUM+'[\\s-]*(?:inch(?:es)?\\b|["”](?=[\\s,.)]))', 'gi'), (m,a)=>`${inchToCm(a)} cm`)
    .replace(new RegExp(NUM+'\\s*(?:oz|ounces?)\\b', 'gi'), (m,a)=>`${roundTo(evalFraction(a)*28.35,5)} g`)
    .replace(new RegExp(NUM+'\\s*(?:lbs?|pounds?)\\b', 'gi'), (m,a)=>`${roundTo(evalFraction(a)*453.6,10)} g`);
}
function needsMetric(r){
  const sys = cupSizeOf(r);
  return (r.ingredients||[]).some(i=>toMetric(i,sys)) || (r.steps||[]).some(s=>convertStepText(s)!==s);
}

/* ---------- GROCERY LIST ---------- */
const MAX_RANGE_DAYS = 62;
function rangeDates(from,to){
  const out=[]; if(!from||!to||to<from) return out;
  let d=new Date(from+'T00:00:00'); const end=new Date(to+'T00:00:00');
  while(d<=end && out.length<MAX_RANGE_DAYS){ out.push(isoDate(d)); d=addDays(d,1); }
  return out;
}
function isRecipeEntry(e){ return !!(e && !e.type && e.recipeId); }
function countMeals(dates){ let n=0; dates.forEach(dt=>MEALS.forEach(m=>{ slotEntries(dt,m).forEach(([k,e])=>{ if(isRecipeEntry(e) && recipes.some(r=>r.id===e.recipeId)) n++; }); })); return n; }
// "Extra virgin olive oil" and "olive oil" are the same thing on a shopping list.
const DESCRIPTORS = /\b(fresh|freshly|large|small|medium|extra|virgin|light|lite|good quality|quality|organic|free[- ]range|ripe|raw|chopped|diced|sliced|minced|grated|finely|roughly|thinly|boneless|skinless|skin[- ]on|bone[- ]in|lean|whole|plain|packed|heaped|level)\b/g;
const SYNONYMS = {'garlic clove':'garlic','clove garlic':'garlic','scallion':'spring onion','green onion':'spring onion','cilantro':'coriander','bell pepper':'capsicum','red bell pepper':'red capsicum','chicken broth':'chicken stock','beef broth':'beef stock','vegetable broth':'vegetable stock','ground beef':'beef mince','courgette':'zucchini'};
function singular(w){
  if(/ies$/.test(w) && w.length>4) return w.slice(0,-3)+'y';
  if(/(oes|ches|shes|xes)$/.test(w)) return w.slice(0,-2);
  if(/s$/.test(w) && !/(ss|us|is|as)$/.test(w) && w.length>3) return w.slice(0,-1);
  return w;
}
function normName(n){
  let x = String(n||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(DESCRIPTORS,' ').replace(/[^a-z0-9&' -]/g,' ').replace(/\s+/g,' ').trim();
  const words = x.split(' '); if(words.length) words[words.length-1] = singular(words[words.length-1]);
  x = words.join(' ');
  return SYNONYMS[x] || x || String(n||'').toLowerCase();
}
const SPOONS = ['tsp','tbsp','pinch','dash'];
function fmtMetricTotal(v, small, big){ return v>=1000 ? `${+(v/1000).toFixed(2)} ${big}` : `${+v.toFixed(v<10?1:0)} ${small}`; }
function buildGroceryList(dates){
  const rows = [];
  (dates||weekDates()).forEach(dateISO=>MEALS.forEach(m=>slotEntries(dateISO,m).forEach(([k,entry])=>{
    if(!isRecipeEntry(entry)) return;              // leftovers, freezer meals, eating out etc. need no shopping
    const r = recipes.find(rc=>rc.id===entry.recipeId); if(!r) return;
    const factor = entry.servings/r.servings;
    (r.ingredients||[]).forEach(ing=>{ if(ing.name && !WATER_RE.test(ing.name.toLowerCase().trim())) rows.push({ing, factor, recipe:r.title}); });
  })));
  const has = q => !(q==null || q==='' || isNaN(q));
  if(!settings.combine){
    const agg = {};
    rows.forEach(({ing,factor,recipe})=>{
      const unit = has(ing.qty) ? ing.unit : '';
      const key = ing.name.toLowerCase()+'|'+unit;
      if(!agg[key]) agg[key]={name:ing.name, qty:has(ing.qty)?0:null, unit, aisle:guessAisle(ing.name), sources:new Set()};
      if(has(ing.qty)) agg[key].qty += ing.qty*factor;
      agg[key].sources.add(recipe);
    });
    return Object.values(agg).map(i=>({name:i.name, amount: i.qty==null ? '' : amountText({qty:+i.qty.toFixed(2), unit:i.unit}), aisle:i.aisle, key:slug(i.name+'-'+i.unit), sources:[...i.sources], pantry:false}));
  }
  const groups = {};
  rows.forEach(row=>{ const n=normName(row.ing.name); (groups[n] = groups[n] || []).push(row); });
  return Object.entries(groups).map(([n, list])=>{
    const name = list.map(r=>r.ing.name).sort((a,b)=>a.length-b.length)[0];
    const pantry = PANTRY_RE.test(n) || list.every(r=>!has(r.ing.qty) || SPOONS.includes(r.ing.unit));
    let g=0, ml=0, other={};
    list.forEach(({ing,factor})=>{
      if(!has(ing.qty)) return;
      const q = ing.qty*factor;
      if(ing.unit==='g') g+=q; else if(ing.unit==='kg') g+=q*1000;
      else if(ing.unit==='mL') ml+=q; else if(ing.unit==='L') ml+=q*1000;
      else other[ing.unit] = (other[ing.unit]||0) + q;
    });
    const parts = [];
    if(g) parts.push(fmtMetricTotal(g,'g','kg'));
    if(ml) parts.push(fmtMetricTotal(ml,'mL','L'));
    Object.entries(other).forEach(([u,q])=>parts.push(amountText({qty:+q.toFixed(2), unit:u})));
    return {name: name.charAt(0).toUpperCase()+name.slice(1), amount: pantry ? '' : parts.join(' + '),
      aisle: pantry ? PANTRY_AISLE : guessAisle(n), key:'c-'+slug(n), sources:[...new Set(list.map(r=>r.recipe))], pantry};
  });
}

function setTab(t){ state.pendingPhoto=null; state.tab=t; state.editingRecipe=null; state.parsedDraft=null; state.picker=null; state.fzFor=null; render(); }

/* ---- Planner ---- */
function entryName(e){ if(!e) return ''; const r=e.recipeId && recipes.find(x=>x.id===e.recipeId); return e.name || (r && r.title) || (ENTRY_TYPES[e.type]||{}).label || 'Meal'; }
function showMeal(m, dateISO){
  if(!OPTIONAL_MEALS.includes(m)) return true;
  if(dayOpt(dateISO, m)) return true;
  return slotEntries(dateISO,m).length>0;
}
function dayOpt(dateISO, m){ const o = plan[planId(dateISO,'DayOpts')]; return !!(o && o[m]); }
function toggleDayOpt(dateISO, m){
  if(slotEntries(dateISO,m).length) return;                  // already has something planned, so it stays
  const key = planId(dateISO,'DayOpts'), cur = plan[key] || {date:dateISO, meal:'DayOpts', type:'opts'};
  const next = {...cur, [m]: !cur[m]};
  if(!OPTIONAL_MEALS.some(x=>next[x])) removePlan(key); else putPlan(key, next);
}
function renderDayOpts(dateISO){
  return `<div class="day-opts">${OPTIONAL_MEALS.map(m=>{ const has = slotEntries(dateISO,m).length>0, on = has || dayOpt(dateISO,m);
    return `<button class="optchip ${on?'on':''}" aria-pressed="${on}" ${has?'disabled title="Remove what’s planned to hide this"':''} onclick="toggleDayOpt('${dateISO}','${m}')">${on?'✓':'+'} ${m}</button>`; }).join('')}</div>`;
}
function slotLabel(key){ const [d,m]=String(key).split('__'); if(!d||!m) return ''; return new Date(d+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short'})+' '+m.toLowerCase(); }
function serveControls(key,e){ return `
  <button onclick="changeServ('${key}',-1)" class="icon-btn" style="width:22px;height:22px;font-size:12px" aria-label="Fewer serves">−</button>
  <span class="num">${e.servings} serve${e.servings>1?'s':''}</span>
  <button onclick="changeServ('${key}',1)" class="icon-btn" style="width:22px;height:22px;font-size:12px" aria-label="More serves">+</button>`; }
function renderEntry(key,e){
  const kind = e.type || 'recipe';
  const r = e.recipeId ? recipes.find(rc=>rc.id===e.recipeId) : null;
  const title = r ? `<button onclick="openRecipe('${r.id}')" class="meal-title">${esc(entryName(e))}</button>` : `<div class="entry-text">${esc(entryName(e))}</div>`;
  const remove = `<button onclick="clearSlot('${key}')" class="remove">Remove</button>`;
  if(kind==='recipe') return `<div class="meal-item">${title}<div class="meal-row">${serveControls(key,e)}${remove}</div></div>`;
  const t = ENTRY_TYPES[kind] || ENTRY_TYPES.custom;
  const tag = `<span class="etag t-${kind}">${t.icon} ${t.label}</span>`;
  if(kind==='leftovers') return `<div class="meal-item">${tag}${title}<div class="meal-row"><span class="entry-sub">${e.fromKey?`from ${esc(slotLabel(e.fromKey))}`:''}</span>${remove}</div></div>`;
  if(kind==='freezer') return `<div class="meal-item">${tag}${title}<div class="meal-row">${serveControls(key,e)}${remove}</div></div>`;
  return `<div class="meal-item">${tag}${e.text?`<div class="entry-text">${esc(e.text)}</div>`:''}<div class="meal-row">${remove}</div></div>`;
}
function renderSlot(dateISO, m, dayName){
  const entries = slotEntries(dateISO,m).filter(([k,e])=>e && (e.type || recipes.some(rc=>rc.id===e.recipeId)));
  return `<div class="meal">
    <div class="label">${m}</div>
    ${entries.map(([k,e])=>renderEntry(k,e)).join('')}
    <button class="slot-add" onclick="openPicker('${dateISO}','${m}')" aria-label="Add to ${dayName} ${m.toLowerCase()}">+ ${entries.length?'Add another':'Add'}</button>
  </div>`;
}
function renderPlanner(){
  const dates = weekDates();
  const monday = new Date(state.weekStart+'T00:00:00');
  const today = isoDate(new Date());
  return `
  <div class="weekbar">
    <div class="weeknav">
      <button onclick="navWeek(-1)" class="icon-btn" aria-label="Previous week">‹</button>
      <div class="range">${fmtWeekRange(monday)}</div>
      <button onclick="navWeek(1)" class="icon-btn" aria-label="Next week">›</button>
      <button onclick="jumpToday()" class="btn small">This week</button>
      <input id="week-picker" type="date" onchange="jumpToWeek(this.value)" value="${state.weekStart}" class="field" style="width:auto;padding:6px 9px;font-size:13px" aria-label="Jump to a week">
    </div>
    <div class="plan-opts">
      <button onclick="copyLastWeek()" class="btn small">Copy last week</button>
    </div>
  </div>
  <div class="days">
  ${dates.map((dateISO,i)=>{
    const d=new Date(dateISO+'T00:00:00'); const isToday = dateISO===today;
    const note = plan[planId(dateISO, DAY_NOTE)];
    return `
    <section class="day ${isToday?'today':''}">
      <div class="day-head"><span class="day-name">${DAY_NAMES[i]}</span><span class="label">${isToday?'Today · ':''}${fmtShort(d)}</span></div>
      ${MEALS.filter(m=>showMeal(m,dateISO)).map(m=>renderSlot(dateISO,m,DAY_NAMES[i])).join('')}
      ${renderDayOpts(dateISO)}
      <textarea class="note-field" rows="1" placeholder="Notes for ${DAY_NAMES[i]}" aria-label="Notes for ${DAY_NAMES[i]}" data-live-edit
        oninput="autoGrow(this)" onchange="saveDayNote('${dateISO}',this.value)" onblur="afterLiveEdit()">${esc(note && note.text || '')}</textarea>
    </section>`;
  }).join('')}
  </div>`;
}
function saveDayNote(dateISO, text){
  const key = planId(dateISO, DAY_NOTE), t = String(text||'').trim();
  if(!t){ if(plan[key]) removePlan(key); return; }
  putPlan(key, {date:dateISO, meal:DAY_NOTE, type:'note', text:t});
}
function openRecipe(id){ state.picker=null; state.tab='recipes'; state.editingRecipe=id; render(); window.scrollTo(0,0); }
function navWeek(delta){ state.weekStart = isoDate(addDays(new Date(state.weekStart+'T00:00:00'), delta*7)); render(); }
function jumpToday(){ state.weekStart = isoDate(getMonday(new Date())); render(); }
function jumpToWeek(dateStr){ if(!dateStr) return; state.weekStart = isoDate(getMonday(new Date(dateStr+'T00:00:00'))); render(); }
async function copyLastWeek(){
  const cur = weekDates();
  const prevFrom = isoDate(addDays(new Date(cur[0]+'T00:00:00'),-7)), prevTo = isoDate(addDays(new Date(cur[6]+'T00:00:00'),-7));
  let prevPlan = plan;
  if(!isDemo() && window.DATA){ try{ prevPlan = await DATA.fetchPlan(prevFrom, prevTo); }catch(e){ showError("Couldn't load last week's plan."); return; } }
  let n=0, skipped=0;
  for(let i=0;i<7;i++){
    const prev = isoDate(addDays(new Date(cur[i]+'T00:00:00'),-7));
    for(const m of MEALS){
      const prevBase = planId(prev,m), curBase = planId(cur[i],m);
      for(const [pk, pe] of slotEntries(prev, m, prevPlan)){
        if(!pe) continue;
        if(pe.type==='freezer'){ skipped++; continue; }   // those serves may already be eaten
        const ck = curBase + pk.slice(prevBase.length);
        if(plan[ck]) continue;
        const entry = {...pe, date:cur[i]};
        if(pe.type==='leftovers' && pe.fromKey){ const [fd,...rest]=pe.fromKey.split('__'); entry.fromKey=[isoDate(addDays(new Date(fd+'T00:00:00'),7)),...rest].join('__'); }
        putPlan(ck, entry); n++;
      }
    }
  }
  if(!n && !skipped){ state.info='Nothing to copy. Last week was empty, or those slots are already filled.'; render(); }
  else if(skipped){ state.info=`Copied ${n} meal${n===1?'':'s'}. Freezer meals weren't copied, so the freezer count stays right. Add those again if you have enough.`; render(); }
}
function addEntry(dateISO, meal, entry){ putPlan(nextSlotKey(dateISO,meal), {date:dateISO, meal, ...entry}); }
function clearSlot(key){
  const e = plan[key];
  // A freezer meal removed before its day goes back in the freezer. Past ones were eaten.
  if(e && e.type==='freezer' && e.freezerId && e.date>=isoDate(new Date()) && freezer.some(f=>f.id===e.freezerId)) adjustFreezer(e.freezerId, +(e.servings||0));
  removePlan(key);
}
function changeServ(key,delta){
  const e=plan[key]; if(!e) return;
  const next = Math.max(1, e.servings+delta); if(next===e.servings) return;
  if(e.type==='freezer'){
    const it = freezer.find(f=>f.id===e.freezerId);
    if(delta>0 && (!it || it.serves<=0)){ showError(`There are no more serves of ${entryName(e)} in the freezer.`); return; }
    if(it) adjustFreezer(it.id, -(next-e.servings));
  }
  putPlan(key, {...e, servings:next});
}

function recipeMatches(r, q){
  const words = String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const hay = [r.title, r.author, ...(r.categories||[]), ...(r.ingredients||[]).map(i=>i.name)].join(' ').toLowerCase();
  return words.every(w=>hay.includes(w));
}
function pickerRecipeList(){
  const p = state.picker;
  const list = recipes.filter(r=>recipeMatches(r,p.q)).sort((a,b)=>a.title.localeCompare(b.title));
  if(!recipes.length) return `<p class="empty" style="margin-top:18px">No recipes yet. Add some in the Recipes tab.</p>`;
  if(!list.length) return `<p class="sub" style="margin-top:16px">No recipes match “${esc(p.q)}”.</p>`;
  const row = r => `<button class="prow" onclick="pickRecipe('${r.id}')"><span class="pt">${esc(r.title)}</span><span class="pm">${esc(r.time||'')}</span></button>`;
  const main = list.filter(r=>(r.categories||[]).includes(p.meal)), rest = list.filter(r=>!(r.categories||[]).includes(p.meal));
  return (main.length?`<div class="pgroup">${p.meal} recipes</div>${main.map(row).join('')}`:'') +

}

/* ---- Photos ---- */
// Firestore documents are capped at 1 MiB, so photos are resized and
// compressed to a JPEG well under that before saving.
const PHOTO_MAX_CHARS = 700000;
async function loadBitmap(file){
  try{ return await createImageBitmap(file); }
  catch(e){
    return await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); });
  }
}
async function compressPhoto(file){
  const bmp = await loadBitmap(file);
  const w0 = bmp.width||bmp.naturalWidth, h0 = bmp.height||bmp.naturalHeight;
  for(const [max,q] of [[1400,0.8],[1200,0.72],[1000,0.65],[800,0.6],[640,0.55]]){
    const s = Math.min(1, max/Math.max(w0,h0));
    const c = document.createElement('canvas'); c.width=Math.round(w0*s); c.height=Math.round(h0*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const url = c.toDataURL('image/jpeg', q);
    if(url.length <= PHOTO_MAX_CHARS) return url;
  }
  throw new Error('too_large');
}
function setPhotoStatus(t){ const el=document.getElementById('photo-status'); if(el) el.textContent=t; }
function setPreview(src){
  const box=document.getElementById('photo-preview'); if(box) box.innerHTML = src ? `<img src="${src}" alt="">` : `<span class="initial">?</span>`;
  const rm=document.getElementById('photo-remove'); if(rm) rm.classList.toggle('hidden', !src);
  const cr=document.getElementById('photo-crop'); if(cr) cr.classList.toggle('hidden', !src);
  const lbl=document.querySelector('label[for="f_photo"]'); if(lbl) lbl.textContent = src ? 'Change photo' : 'Add photo';
}
// Choosing a photo opens a cropper with a 4:3 frame (the shape recipe cards use).
async function pickPhoto(input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  setPhotoStatus('Opening photo…');
  try{ openCropper(await loadBitmap(file)); setPhotoStatus(''); }
  catch(e){ setPhotoStatus("That photo couldn't be read. Try a JPEG or PNG."); }
}
function recropPhoto(){
  const d = state.parsedDraft; if(!d) return;
  const src = d.photo==='__pending__' ? state.pendingPhoto : photoSrc(d.photo);
  if(!src){ setPhotoStatus('The photo is still loading. Try again in a moment.'); return; }
  const img = new Image(); img.onload = ()=>openCropper(img); img.src = src;
}
let crop = null;
function openCropper(img){
  const w0 = img.width||img.naturalWidth, h0 = img.height||img.naturalHeight;
  const fw = Math.max(240, Math.min(560, window.innerWidth-40)), fh = Math.round(fw*3/4), dpr = window.devicePixelRatio||1;
  const min = Math.max(fw/w0, fh/h0);
  crop = {img, w0, h0, fw, fh, dpr, min, scale:min, x:(fw-w0*min)/2, y:(fh-h0*min)/2, pts:new Map(), dist:0};
  const wrap = document.createElement('div');
  wrap.className='crop-wrap'; wrap.id='crop-wrap'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true'); wrap.setAttribute('aria-label','Crop photo');
  wrap.innerHTML = `<p style="margin:0;text-align:center">Drag to position the photo. Zoom with the slider or by pinching.</p>
    <canvas id="crop-canvas" width="${Math.round(fw*dpr)}" height="${Math.round(fh*dpr)}" style="width:${fw}px;height:${fh}px"></canvas>
    <div class="crop-tools"><label for="crop-zoom">Zoom</label><input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1"></div>
    <div class="crop-tools"><button class="btn ghost" onclick="closeCropper()">Cancel</button><button class="btn" id="crop-ok" onclick="finishCrop()">Use photo</button></div>`;
  document.body.appendChild(wrap);
  const cv = document.getElementById('crop-canvas');
  cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); crop.pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); crop.dist=0; });
  cv.addEventListener('pointermove', e=>{
    if(!crop || !crop.pts.has(e.pointerId)) return;
    const prev = crop.pts.get(e.pointerId); crop.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(crop.pts.size===1){ crop.x += e.clientX-prev.x; crop.y += e.clientY-prev.y; drawCrop(); }
    else if(crop.pts.size===2){
      const [a,b] = [...crop.pts.values()], dist = Math.hypot(a.x-b.x, a.y-b.y), r = cv.getBoundingClientRect();
      if(crop.dist) zoomCrop(crop.scale*dist/crop.dist, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top);
      crop.dist = dist;
    }
  });
  const up = e=>{ if(crop){ crop.pts.delete(e.pointerId); crop.dist=0; } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomCrop(crop.scale*(1-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  document.getElementById('crop-zoom').addEventListener('input', e=>zoomCrop(crop.min*(+e.target.value), crop.fw/2, crop.fh/2));
  drawCrop();
  document.getElementById('crop-ok').focus();
}
function zoomCrop(ns, cx, cy){
  ns = Math.min(crop.min*4, Math.max(crop.min, ns));
  crop.x = cx-(cx-crop.x)*(ns/crop.scale); crop.y = cy-(cy-crop.y)*(ns/crop.scale); crop.scale = ns;
  const z = document.getElementById('crop-zoom'); if(z && document.activeElement!==z) z.value = ns/crop.min;
  drawCrop();
}
function drawCrop(){
  const c = crop, cv = document.getElementById('crop-canvas'); if(!c || !cv) return;
  c.x = Math.min(0, Math.max(c.fw-c.w0*c.scale, c.x)); c.y = Math.min(0, Math.max(c.fh-c.h0*c.scale, c.y));
  const ctx = cv.getContext('2d'); ctx.setTransform(c.dpr,0,0,c.dpr,0,0);
  ctx.clearRect(0,0,c.fw,c.fh); ctx.imageSmoothingQuality='high';
  ctx.drawImage(c.img, c.x, c.y, c.w0*c.scale, c.h0*c.scale);
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1; ctx.beginPath();
  [1,2].forEach(i=>{ ctx.moveTo(c.fw*i/3,0); ctx.lineTo(c.fw*i/3,c.fh); ctx.moveTo(0,c.fh*i/3); ctx.lineTo(c.fw,c.fh*i/3); }); ctx.stroke();
}
function closeCropper(){ const w=document.getElementById('crop-wrap'); if(w) w.remove(); crop=null; }
function finishCrop(){
  const c = crop; if(!c) return;
  const sx=-c.x/c.scale, sy=-c.y/c.scale, sw=c.fw/c.scale, sh=c.fh/c.scale;
  let url = null;
  for(const [max,q] of [[1400,0.8],[1200,0.72],[1000,0.65],[800,0.6],[640,0.55]]){
    const w = Math.round(Math.min(max, sw)), h = Math.round(w*3/4);
    const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality='high';
    ctx.drawImage(c.img, sx, sy, sw, sh, 0, 0, w, h);
    const u = cv.toDataURL('image/jpeg', q);
    if(u.length <= PHOTO_MAX_CHARS){ url=u; break; }
  }
  closeCropper();
  if(!url){ setPhotoStatus("That photo couldn't be made small enough. Try another."); return; }
  state.pendingPhoto = url; state.parsedDraft.photo = '__pending__';
  setPreview(url); setPhotoStatus('Photo ready. Save the recipe to keep it.');
}
function removePhoto(){ state.pendingPhoto=null; state.parsedDraft.photo=null; setPreview(null); setPhotoStatus('Photo will be removed when you save.'); }

async function saveManual(id){
  const title=document.getElementById('f_title').value.trim()||'Untitled';
  const time=document.getElementById('f_time').value.trim();
  const author=document.getElementById('f_author').value.trim();
  const sourceUrl=cleanUrl(document.getElementById('f_url').value);
  const servings=Math.max(1, +document.getElementById('f_servings').value||1);
  const categories=[...document.querySelectorAll('.f_cat_box')].filter(cb=>cb.checked).map(cb=>cb.value);
  const qtys=[...document.querySelectorAll('.ing-qty')], units=[...document.querySelectorAll('.ing-unit')], names=[...document.querySelectorAll('.ing-name')];
  const ingredients = names.map((n,i)=>{
    const {name, note} = splitNote(n.value);
    const qRaw = cleanLine(qtys[i].value);
    const q = qRaw ? evalFraction(qRaw) : NaN;
    const hasQty = !isNaN(q) && q>0;
    return {name, note, qty: hasQty ? +q.toFixed(3) : null, unit: hasQty ? (normalizeUnit(units[i].value.trim())) : ''};
  }).filter(i=>i.name);
  const steps = document.getElementById('f_steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const existing = recipes.find(r=>r.id===id);
  const oldPhoto = existing && existing.photo || null;
  let photo = state.parsedDraft ? (state.parsedDraft.photo||null) : null;
  if(photo==='__pending__' && state.pendingPhoto){
    photo = 'p'+Date.now()+Math.random().toString(36).slice(2,7);
    photoCache[photo] = state.pendingPhoto;
    const data = state.pendingPhoto;
    write(()=>DATA.setPhoto(photo, data, id), ()=>{});
  } else if(photo==='__pending__') photo = oldPhoto;
  const cupSize = (document.getElementById('f_cups')||{}).value || 'au';
  const rec = {id, title, author, sourceUrl, time, servings, cupSize, categories: categories.length?categories:['Dinner'], lastPlanned: existing?existing.lastPlanned:null, ingredients, steps, photo};
  state.pendingPhoto=null; state.editingRecipe=id; state.parsedDraft=null;
  putRecipe(rec);
  if(oldPhoto && oldPhoto!==photo) dropAsset(oldPhoto);
  render(); window.scrollTo(0,0);
}

  const r = recipes.find(rc=>rc.id===id);

  const factor = serv/r.servings;
  const confirming = state.confirmDelete===id;

  const showIng = i => { const s0 = scaleIngredient(i,factor); const s1 = metric ? metricIng(s0, sys) : s0; return {...s1, amt:(s1.approx?'≈ ':'')+amountText(s1)}; };
  const inFreezer = freezer.filter(f=>f.recipeId===r.id && +f.serves>0).reduce((t,f)=>t+(+f.serves),0);
  return `
  <button onclick="state.editingRecipe=null;state.confirmDelete=null;render()" class="back">← Recipes</button>
  ${r.photo&&photoSrc(r.photo)?`<div class="hero"><img src="${photoSrc(r.photo)}" alt="${esc(r.title)}" onerror="this.parentElement.remove()"></div>`:''}
  <div class="detail-head">
    <div>
      <div class="tags" style="margin-bottom:6px">${(r.categories||[]).map(c=>`<span class="label">${c}</span>`).join('')}</div>
      <h2>${esc(r.title)}</h2>
      ${sourceLine(r)?`<div class="source">${sourceLine(r)}</div>`:''}
      <div class="meta">${esc(r.time)} · ${r.lastPlanned?`last planned ${fmtPlanned(r.lastPlanned)}`:'not planned yet'}${inFreezer?` · ${inFreezer} serve${inFreezer===1?'':'s'} in the freezer`:''}</div>
    </div>
    <div class="actions">
      <button onclick="editRecipe('${r.id}')" class="btn small">Edit</button>
      ${confirming
        ? `<span class="sub">Delete this recipe?</span><button onclick="deleteRecipe('${r.id}')" class="danger" style="font-weight:700">Yes, delete</button><button onclick="state.confirmDelete=null;render()">Cancel</button>`
        : `<button onclick="state.confirmDelete='${r.id}';render()" class="danger">Delete</button>`}
    </div>
  </div>
  <div class="serves">
    <span class="label">Serves</span>
    <button onclick="setViewServ('${r.id}',${serv-1})" class="icon-btn" aria-label="Fewer serves">−</button>
    <span class="n num">${serv}</span>
    <button onclick="setViewServ('${r.id}',${serv+1})" class="icon-btn" aria-label="More serves">+</button>
    ${canMetric?`<span class="seg" role="group" aria-label="Units"><button class="${metric?'':'on'}" onclick="setSetting('metricView',false)">As written</button><button class="${metric?'on':''}" onclick="setSetting('metricView',true)">Metric</button></span>`:''}
    ${state.fzFor===r.id
      ? `<span class="fz-inline"><label for="fz-serves">Serves to freeze</label><input id="fz-serves" class="field" type="number" min="1" value="${serv}"><button class="btn small primary" onclick="addRecipeToFreezer('${r.id}')">Add to freezer</button><button class="textlink" onclick="state.fzFor=null;render()">Cancel</button></span>`
      : `<button class="btn small" onclick="state.fzFor='${r.id}';render()">🧊 Add to freezer</button>`}
  </div>
  ${metric?`<div class="conv-note">
    <span class="seg" role="group" aria-label="Cup size" style="margin-right:8px"><button class="${sys==='au'?'on':''}" onclick="setCupSize('${r.id}','au')">Australian cups</button><button class="${sys==='us'?'on':''}" onclick="setCupSize('${r.id}','us')">US cups</button></span>
    ${sys==='us'?'US recipe: cups are 240 mL, and a US tablespoon is 15 mL (use 3 teaspoons; an Australian tablespoon is 20 mL).':'Australian cups are 250 mL.'} Weights marked ≈ are approximate, as they depend on how the cup is filled.</div>`:''}
  <div class="two-col">
    <div>
      <h3 class="col-title">Ingredients</h3>
      <ul class="ing-list">
        ${(r.ingredients||[]).map(i=>{const s=showIng(i); return `<li><span class="q num">${esc(s.amt)}</span><span>${esc(s.name)}${s.note?`<span class="sub">, ${esc(s.note)}</span>`:''}</span></li>`}).join('')}
      </ul>
    </div>
    <div>
      <h3 class="col-title">Method</h3>
      <ol class="steps">${(r.steps||[]).map(s=>`<li><span>${esc(metric?convertStepText(s):s)}</span></li>`).join('')}</ol>

}
function setViewServ(id,n){ state.viewServ={id, n:Math.max(1,n)}; render(); }
function setCupSize(id, size){ const r=recipes.find(x=>x.id===id); if(r && r.cupSize!==size) putRecipe({...r, cupSize:size}); render(); }
function addRecipeToFreezer(id){
  const r=recipes.find(x=>x.id===id); if(!r) return;
  const n=Math.max(1, Math.round(+document.getElementById('fz-serves').value||1));
  putFreezer({id:'f'+Date.now(), name:r.title, recipeId:r.id, serves:n, frozenOn:isoDate(new Date()), note:''});
  state.fzFor=null; state.info=`Added ${n} serve${n===1?'':'s'} of ${r.title} to the freezer.`; render();
}

/* ---- Freezer ---- */
function ageText(iso){
  if(!iso) return '';
  const days = Math.round((new Date(isoDate(new Date())+'T00:00:00') - new Date(iso+'T00:00:00'))/86400000);
  if(days<=0) return 'today'; if(days===1) return 'yesterday'; if(days<14) return `${days} days ago`;
  if(days<60) return `${Math.round(days/7)} weeks ago`; return `${Math.round(days/30.4)} months ago`;
}
function renderFreezer(){
  const list = freezer.slice().sort((a,b)=>((+b.serves>0)-(+a.serves>0)) || String(a.frozenOn).localeCompare(String(b.frozenOn)));
  const total = freezer.reduce((t,f)=>t+Math.max(0,+f.serves||0),0);
  return `
  <datalist id="fz-recipes">${recipes.map(r=>`<option value="${esc(r.title)}">`).join('')}</datalist>
  <div class="fz-form">
    <label class="wide"><span class="label">Meal</span><input id="fz-name" class="field" list="fz-recipes" placeholder="e.g. Spaghetti Bolognese"></label>
    <label><span class="label">Serves</span><input id="fz-n" class="field" type="number" min="1" value="4"></label>
    <label><span class="label">Frozen on</span><input id="fz-date" class="field" type="date" value="${isoDate(new Date())}"></label>
    <div class="wide"><button class="btn primary" onclick="addFreezerItem()">Add to freezer</button></div>
  </div>
  <div class="fz-list">
    <p class="sub" style="margin:0 0 6px">${total ? `${total} serve${total===1?'':'s'} in the freezer. Oldest first, so you use those up first.` : 'The freezer is empty. Add meals above, or from a recipe’s page.'}</p>
    ${list.map(f=>{
      const r = f.recipeId && recipes.find(x=>x.id===f.recipeId), n=+f.serves||0, old = f.frozenOn && (new Date()-new Date(f.frozenOn+'T00:00:00'))/86400000 > 90;
      const confirming = state.confirmFz===f.id;
      return `<div class="fz-item ${n>0?'':'gone'}">
        ${r?`<button class="fz-name" onclick="openRecipe('${r.id}')">${esc(f.name)}</button>`:`<div class="fz-name">${esc(f.name)}</div>`}
        <div class="fz-count">
          <button class="icon-btn" onclick="adjustFreezer('${f.id}',-1)" ${n<=0?'disabled':''} aria-label="One less serve of ${esc(f.name)}">−</button>
          <span class="n num" aria-label="${n} serves">${n}</span>
          <button class="icon-btn" onclick="adjustFreezer('${f.id}',1)" aria-label="One more serve of ${esc(f.name)}">+</button>
        </div>
        <div class="meta">${n>0?`Frozen ${ageText(f.frozenOn)}`:'All eaten'}${n>0&&old?' · over 3 months: still safe if kept frozen, best eaten soon for taste':''} ·
          ${confirming?`<button class="textlink" style="color:var(--danger);font-weight:700" onclick="state.confirmFz=null;removeFreezer('${f.id}')">Yes, remove</button> <button class="textlink" onclick="state.confirmFz=null;render()">Cancel</button>`
                      :`<button class="textlink" onclick="state.confirmFz='${f.id}';render()">Remove</button>`}</div>
      </div>`; }).join('')}
  </div>`;
}
function addFreezerItem(){
  const name = document.getElementById('fz-name').value.trim();
  if(!name){ showError('Type the name of the meal first.'); return; }
  const n = Math.max(1, Math.round(+document.getElementById('fz-n').value||1));
  const date = document.getElementById('fz-date').value || isoDate(new Date());
  const r = recipes.find(x=>x.title.toLowerCase()===name.toLowerCase());
  putFreezer({id:'f'+Date.now(), name: r?r.title:name, recipeId: r?r.id:null, serves:n, frozenOn:date, note:''});
  state.info = `Added ${n} serve${n===1?'':'s'} of ${r?r.title:name} to the freezer.`; render();
}
async function deleteRecipe(id){
  const r = recipes.find(x=>x.id===id);
  state.editingRecipe=null; state.confirmDelete=null;
  await removeRecipe(id);
  if(r && r.photo) await dropAsset(r.photo);
  render();
}

/* ---- Shopping list ---- */
function shopDates(){ return rangeDates(state.shopFrom, state.shopTo); }
function checkKey(i){ return i.key; }
function sortedAisles(list){ const rank=a=>a===PANTRY_AISLE?2:a==='Other'?1:0; return [...new Set(list.map(i=>i.aisle))].sort((a,b)=>rank(a)-rank(b) || a.localeCompare(b)); }
function fmtDay(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function setShopRange(from,to){
  if(!from||!to) return;
  if(to<from){ const t=from; from=to; to=t; }
  const days = rangeDates(from,to);
  if(days.length && days[days.length-1]!==to) to = days[days.length-1];
  state.shopFrom=from; state.shopTo=to; state.exportMsg=null; render();
}
function presetRange(kind){
  const today=isoDate(new Date());
  if(kind==='week'){ const mon=state.weekStart; setShopRange(mon, isoDate(addDays(new Date(mon+'T00:00:00'),6))); }
  else if(kind==='3') setShopRange(today, isoDate(addDays(new Date(today+'T00:00:00'),2)));
  else if(kind==='7') setShopRange(today, isoDate(addDays(new Date(today+'T00:00:00'),6)));
}
function activePreset(){
  const today=isoDate(new Date());
  const plus=(d,n)=>isoDate(addDays(new Date(d+'T00:00:00'),n));
  if(state.shopFrom===state.weekStart && state.shopTo===plus(state.weekStart,6)) return 'week';
  if(state.shopFrom===today && state.shopTo===plus(today,2)) return '3';
  if(state.shopFrom===today && state.shopTo===plus(today,6)) return '7';
  return '';
}
function itemLine(i){ return i.amount ? `${i.name} (${i.amount})` : i.name; }
function buildExportText(list){
  const lines=[];
  sortedAisles(list).forEach(a=>{
    const items=list.filter(i=>i.aisle===a && !groceryChecks[checkKey(i)]);
    if(!items.length) return;
    if(state.exportHeadings){ if(lines.length) lines.push(''); lines.push(a.toUpperCase()); }
    items.forEach(i=>lines.push(itemLine(i)));
  });
  return lines.join('\n');
}
function exportList(){
  const list = buildGroceryList(shopDates());
  const text = buildExportText(list);
  if(!text){ state.exportMsg={ok:false, text:'', note:'Nothing to copy. Everything in this range is already ticked off.'}; render(); return; }
  const count = text.split('\n').filter(l=>l && !/^[A-Z &]+$/.test(l)).length;
  const done = ok=>{ state.exportMsg={ok, text, count}; render(); if(!ok){ const t=document.getElementById('export-text'); if(t){ t.focus(); t.select(); } } };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
    } else done(false);
  }catch(e){ done(false); }
}
function renderExportTip(){
  const m=state.exportMsg; if(!m) return '';
  if(!m.text) return `<div class="tip">${esc(m.note)}</div>`;
  return `<div class="tip" role="status">
    <strong>${m.ok?`Copied ${m.count} item${m.count===1?'':'s'}.`:'Your browser blocked automatic copying. Copy the text below instead.'}</strong>
    <ol>
      <li>Open <strong>Reminders</strong> and go to your shopping list. A list set to the Groceries type sorts items into aisles for you (iOS 17 or later).</li>
      <li>Tap <strong>New Reminder</strong>, then touch and hold and choose <strong>Paste</strong>.</li>
      <li>Each line should come in as its own item. If it arrives as one reminder instead, paste into a Notes checklist, or use a “batch add reminders” shortcut.</li>
    </ol>
    ${m.ok?'':`<textarea id="export-text" class="field" rows="${Math.min(12, m.text.split('\n').length+1)}" readonly>${esc(m.text)}</textarea>`}
    <button onclick="state.exportMsg=null;render()" class="textlink" style="margin-top:8px">Dismiss</button>
  </div>`;
}
function renderGrocery(){
  const dates = shopDates();
  const list = buildGroceryList(dates);
  const aisles = sortedAisles(list);
  const meals = countMeals(dates);
  const preset = activePreset();
  const heading = dates.length===7 && preset==='week' ? 'This week’s shop' : `${dates.length}-day shop`;
  return `
  <div class="range-bar">
    <div class="range-row">
      <label><span class="label">From</span><input id="shop-from" type="date" class="field" value="${state.shopFrom}" onchange="setShopRange(this.value, state.shopTo)"></label>
      <label><span class="label">To</span><input id="shop-to" type="date" class="field" value="${state.shopTo}" min="${state.shopFrom}" onchange="setShopRange(state.shopFrom, this.value)"></label>
      <div class="presets">
        <button onclick="presetRange('week')" class="btn small preset ${preset==='week'?'active':''}">Planner week</button>
        <button onclick="presetRange('3')" class="btn small preset ${preset==='3'?'active':''}">Next 3 days</button>
        <button onclick="presetRange('7')" class="btn small preset ${preset==='7'?'active':''}">Next 7 days</button>
      </div>
    </div>
    <div class="sub" style="font-size:13px">${fmtDay(state.shopFrom)} to ${fmtDay(state.shopTo)} · ${meals} planned meal${meals===1?'':'s'}${dates.length>=MAX_RANGE_DAYS?` · ranges are capped at ${MAX_RANGE_DAYS} days`:''}</div>
  </div>
  <div class="sheet">
    <div class="sheet-head">
      <div><div class="label">${fmtShort(new Date(state.shopFrom+'T00:00:00'))} – ${fmtShort(new Date(state.shopTo+'T00:00:00'))}</div><h2>${heading}</h2></div>
      <label class="chip"><input type="checkbox" id="combine-toggle" ${settings.combine?'checked':''} onchange="setSetting('combine',this.checked)"> Combine similar items</label>
    </div>
    ${list.length===0?`<p class="empty" style="margin-top:22px">No meals planned in these dates yet.</p>`:''}
    ${aisles.map(a=>`
      <div class="aisle">
        <div class="label">${a}</div>
        ${a===PANTRY_AISLE?`<p class="sub" style="font-size:13px;margin:2px 0 6px">Small amounts of things most kitchens already have. Check the cupboard before you buy.</p>`:''}
        ${list.filter(i=>i.aisle===a).sort((x,y)=>x.name.localeCompare(y.name)).map(i=>{
          const k=checkKey(i); const checked=!!groceryChecks[k];
          const src = (i.pantry || i.sources.length>1) ? `<span class="src">${i.pantry?`In ${i.sources.length} meal${i.sources.length===1?'':'s'}: `:'For '}${esc(i.sources.join(', '))}</span>` : '';
          return `<label class="gitem ${checked?'done':''}">
            <input type="checkbox" id="chk-${k}" ${checked?'checked':''} onchange="putCheck('${k}',this.checked)">
            <span class="q num">${esc(i.amount)}</span><span class="txt"><span>${esc(i.name)}</span>${src}</span>
          </label>`;
        }).join('')}
      </div>`).join('')}
    ${list.length?`
      <div class="export-row">
        <button onclick="exportList()" class="btn primary">Copy for Reminders</button>
        <label class="chip"><input type="checkbox" id="export-headings" ${state.exportHeadings?'checked':''} onchange="state.exportHeadings=this.checked;state.exportMsg=null"> Include aisle headings</label>
        <span class="sub" style="font-size:13px">Ticked items are left out.</span>
      </div>
      ${renderExportTip()}
`:''}
  </div>`;
}
